<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container py-5">

        <h1 class="mb-2">Job Application Tracker</h1>
        <p class="text-muted mb-4">
            Keep track of your job applications and their progress.
        </p>

        <!-- Add Job Application -->
        <section class="card shadow-sm mb-4">
            <div class="card-body">

                <h2 class="h4 mb-3">Add Application</h2>

                <form id="applicationForm">

                    <div class="row g-3">

                        <div class="col-md-6"> 
                            <label for="company" class="form-label">Company</label>
                            <input type="text" class="form-control" id="company" name="company" required />
                        </div>

                        <div class="col-md-6">
                            <label for="position" class="form-label">Position</label>
                            <input type="text" class="form-control" id="position" name="position" required />
                        </div>

                        <div class="col-md-4">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status">
                                <option value="Applied">Applied</option>
                                <option value="Interview">Interview</option>
                                <option value="Offer">Offer</option>
                                <option value="Rejected">Rejected</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="dateApplied" class="form-label">Date Applied</label>
                            <input type="date" class="form-control" id="dateApplied" name="dateApplied" required>
                        </div>

                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">Add Application</button>
                        </div>

                    </div>

                </form>
            </div>
        </section>


        <!-- Job Applications -->
        <section class="card shadow-sm">
            <div class="card-body">

                <h2 class="h4 mb-3">My Applications</h2>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">

                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Company</th>
                                <th>Position</th>
                                <th>Status</th>
                                <th>Date Applied</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="applicationList">
                            <!-- JavaScript will render applications here -->
                        </tbody>

                    </table>
                </div>

            </div>
        </section>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
